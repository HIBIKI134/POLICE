<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATLITE SAP-520PB-M</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  body {
    background: #111317; color: #fff; font-family: sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; margin: 0; padding: 12px;
  }
  .amp {
    width: 100%; max-width: 680px; background: #22262c;
    border: 3px solid #444c56; border-radius: 10px; padding: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.8);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 14px;
    font-size: 14px;
  }
  .brand { font-weight: 900; font-size: 20px; letter-spacing: 1.5px; }
  .status {
    background: #14171c; border: 1px solid #333; padding: 4px 10px;
    border-radius: 14px; font-size: 12px; color: #9ba3af;
  }
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .btn {
    background: #2c313a; border: 2px solid #3f4652; border-radius: 8px;
    padding: 10px 6px; min-height: 86px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    text-align: center; transition: 0.08s;
  }
  .btn:active { transform: translateY(2px); }
  .btn.off { opacity: 0.4; pointer-events: none; }
  .btn.stop { background: #3d1c1e; border-color: #7a2e32; }
  .led { width: 26px; height: 5px; border-radius: 3px; background: #111; }
  .led.g.on { background: #2ea043; box-shadow: 0 0 10px #3fb950; }
  .led.r.on { background: #ff2a2a; box-shadow: 0 0 12px #ff2a2a; }
  .led.y.on { background: #f0883e; box-shadow: 0 0 10px #f0883e; }
  .title { font-size: 14px; font-weight: bold; line-height: 1.25; }
  .sub { font-size: 10px; color: #9ba3af; }
  .beacons {
    margin-top: 14px; background: #0d1014; border-radius: 6px; padding: 8px;
    display: flex; justify-content: space-around; align-items: center;
  }
  .lamp {
    width: 54px; height: 18px; border-radius: 9px; background: #2a0a0a;
  }
  .lamp.flash { background: #ff1e1e; box-shadow: 0 0 24px #ff1e1e; }
</style>
</head>
<body>
<div class="amp">
  <div class="header">
    <span class="brand">PATLITE</span>
    <span class="status" id="st">⚫ 電源OFF</span>
    <span style="font-family:monospace;color:#adbac7;">SAP-520PB-M</span>
  </div>
  <div class="grid">
    <div class="btn" id="bPwr"><div class="led g" id="lPwr"></div><div class="title">電源</div><div class="sub">ON/OFF</div></div>
    <div class="btn off" id="bLgt"><div class="led r" id="lLgt"></div><div class="title">🚨警光灯</div><div class="sub">緊光灯連動</div></div>
    <div class="btn off" id="b4s"><div class="led r" id="l4s"></div><div class="title">4秒<br>自動</div><div class="sub">周期 4.0秒</div></div>
    <div class="btn off" id="b8s"><div class="led r" id="l8s"></div><div class="title">8秒<br>自動</div><div class="sub">周期 8.0秒</div></div>
    <div class="btn off" id="bMan"><div class="led y" id="lMan"></div><div class="title">手動</div><div class="sub">（長押し）</div></div>
    <div class="btn off" id="bMic"><div class="led y" id="lMic"></div><div class="title">マイク</div><div class="sub">補助入力</div></div>
    <div class="btn off" id="bFoot"><div class="led g" id="lFoot"></div><div class="title">起立 [確認]</div><div class="sub">足踏み連動</div></div>
    <div class="btn stop off" id="bStop"><div class="led"></div><div class="title">サイレン<br>停止</div><div class="sub">吹鳴解除</div></div>
  </div>
  <div class="beacons">
    <div class="lamp" id="lp1"></div>
    <span style="font-size:11px;color:#6e7681;">SAP-520 SERIES</span>
    <div class="lamp" id="lp2"></div>
  </div>
</div>
<script>
let pwr = false, lgt = false, foot = false, mic = false, mode = 'stop';
let ctx = null, osc = null, gain = null, cycT = null, flsT = null, manT = null, freq = 360;
const $ = id => document.getElementById(id);
const ctrls = ['bLgt','b4s','b8s','bMan','bMic','bFoot','bStop'].map($);

function audioInit() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
}

function toneOn(f = 380) {
  audioInit(); toneOff();
  osc = ctx.createOscillator(); gain = ctx.createGain();
  const flt = ctx.createBiquadFilter();
  osc.type = 'sawtooth'; osc.frequency.setValueAtTime(f, ctx.currentTime);
  flt.type = 'lowpass'; flt.frequency.setValueAtTime(1400, ctx.currentTime);
  gain.gain.setValueAtTime(0.001, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.06);
  osc.connect(flt); flt.connect(gain); gain.connect(ctx.destination);
  osc.start();
}

function toneOff() {
  if (osc && ctx) {
    const o = osc, g = gain, now = ctx.currentTime;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    setTimeout(() => { try { o.stop(); o.disconnect(); } catch(e){} }, 120);
  }
  osc = null;
}

function startAuto(sec) {
  if (!pwr) return;
  stopSiren(); mode = sec + 's'; setLight(true); render();
  toneOn(400);
  const run = () => {
    if (!osc) return;
    const t = ctx.currentTime;
    osc.frequency.cancelScheduledValues(t);
    osc.frequency.setValueAtTime(420, t);
    osc.frequency.exponentialRampToValueAtTime(960, t + sec * 0.45);
    osc.frequency.exponentialRampToValueAtTime(420, t + sec);
  };
  run(); cycT = setInterval(run, sec * 1000);
}

function startManual() {
  if (!pwr) return;
  clearInterval(cycT); clearInterval(manT);
  mode = 'man'; setLight(true); render();
  if (!osc) { freq = 360; toneOn(freq); }
  manT = setInterval(() => {
    if (osc && freq < 980) {
      freq += 18; osc.frequency.setTargetAtTime(freq, ctx.currentTime, 0.04);
    }
  }, 30);
}

function endManual() {
  if (mode !== 'man') return;
  clearInterval(manT);
  manT = setInterval(() => {
    if (osc && freq > 360) {
      freq -= 14; osc.frequency.setTargetAtTime(freq, ctx.currentTime, 0.06);
    } else {
      clearInterval(manT); toneOff(); mode = 'stop'; render();
    }
  }, 30);
}

function stopSiren() {
  clearInterval(cycT); clearInterval(manT); toneOff(); mode = 'stop'; render();
}

function setLight(on) {
  lgt = on; clearInterval(flsT);
  $('lp1').classList.remove('flash'); $('lp2').classList.remove('flash');
  if (lgt && pwr) {
    let f = false;
    flsT = setInterval(() => {
      f = !f;
      $('lp1').classList.toggle('flash', f);
      $('lp2').classList.toggle('flash', !f);
    }, 220);
  }
  render();
}

function render() {
  ctrls.forEach(b => b.classList.toggle('off', !pwr));
  $('lPwr').classList.toggle('on', pwr);
  $('lLgt').classList.toggle('on', pwr && lgt);
  $('l4s').classList.toggle('on', pwr && mode === '4s');
  $('l8s').classList.toggle('on', pwr && mode === '8s');
  $('lMan').classList.toggle('on', pwr && mode === 'man');
  $('lMic').classList.toggle('on', pwr && mic);
  $('lFoot').classList.toggle('on', pwr && foot);
  $('st').textContent = !pwr ? '電源OFF' :
    mode === '4s' ? '4秒自動' :
    mode === '8s' ? '8秒自動' :
    mode === 'man' ? '手動サイレン' :
    lgt ? '赤色灯 作動中' : 'スタンバイ中';
}

$('bPwr').onclick = () => {
  pwr = !pwr;
  if (pwr) audioInit(); else { stopSiren(); setLight(false); mic = false; foot = false; }
  render();
};
$('bLgt').onclick = () => pwr && setLight(!lgt);
$('b4s').onclick = () => startAuto(4);
$('b8s').onclick = () => startAuto(8);
$('bMic').onclick = () => { if (pwr) { mic = !mic; render(); } };
$('bFoot').onclick = () => {
  if (!pwr) return;
  foot = !foot;
  if (foot) startAuto(8); else stopSiren();
};
$('bStop').onclick = () => pwr && stopSiren();

$('bMan').onmousedown = startManual;
$('bMan').ontouchstart = e => { e.preventDefault(); startManual(); };
window.onmouseup = endManual;
window.ontouchend = endManual;
render();
</script>
</body>
</html>
