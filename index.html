<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PATLITE SAP-520PB-M GitHub Edition v3</title>
    <style>
        body {
            background-color: #151515;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .amplifier {
            background-color: #1e1e1e;
            border: 4px solid #333;
            border-radius: 6px;
            padding: 20px;
            width: 580px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        .brand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #888;
            margin-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 5px;
        }
        .brand-logo {
            font-weight: 900;
            font-style: italic;
            color: #ccc;
            letter-spacing: 1px;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        button {
            height: 55px;
            border-radius: 6px;
            border: 2px solid #111;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 3px 5px rgba(0,0,0,0.5);
            transition: all 0.05s;
            line-height: 1.3;
        }
        button span {
            font-size: 9px;
            font-weight: normal;
            opacity: 0.8;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px #111;
        }
        .btn-black { background-color: #2a2a2a; }
        .btn-power { background-color: #3a3a3a; color: #ff4444; border-color: #555; }
        .btn-red { background-color: #c9302c; border-color: #ac2925; }
        .btn-green { background-color: #449d44; border-color: #398439; }
        .btn-red.active { background-color: #ff2222; box-shadow: 0 0 12px #ff2222; }
        .btn-black.active { background-color: #ffcc00; color: #000; border-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        
        .mic-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: #888;
            cursor: pointer;
            background-color: #222;
            border-radius: 6px;
            border: 2px solid #111;
            height: 51px;
        }
        .mic-jack {
            width: 23px;
            height: 23px;
            background: radial-gradient(circle, #111 40%, #666 70%);
            border-radius: 50%;
            border: 2px solid #444;
            margin-top: 3px;
            transition: all 0.2s;
        }
        .mic-container.active {
            background-color: #444;
            border-color: #ffcc00;
        }
        .mic-container.active .mic-jack {
            background: radial-gradient(circle, #ffcc00 40%, #886600 70%);
            box-shadow: 0 0 10px #ffcc00;
        }
        .status-text {
            grid-column: span 6;
            font-size: 11px;
            color: #00ff00;
            margin-bottom: 5px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="amplifier">
    <div class="brand-header">
        <span class="brand-logo">PATLITE</span>
        <span id="statusLabel" class="status-text">🟢 GitHub直送モード：音源同期中</span>
        <span>SAP-520PB-M</span>
    </div>
    
    <div class="panel-grid">
        <button class="btn-power">電源<br><span>□ ON/OFF</span></button>
        <button id="btn-light" class="btn-red" onclick="toggleLight()">((( 🚨 )))<br><span>警光灯・緊光灯</span></button>
        <button class="btn-black"></button> 
        <button id="btn-4s" class="btn-black" onclick="pressSirenButton('4s')">4秒<br><span>自動</span></button>
        <button id="btn-8s" class="btn-black" onclick="pressSirenButton('8s')">8秒<br><span>自動</span></button>
        
        <button id="btn-manual" class="btn-black" 
                onmousedown="startManual()" onmouseup="stopManual()" 
                ontouchstart="startManual()" ontouchend="stopManual()">🖐 手動<br><span>（長押し）</span></button>
        
        <div id="micBtn" class="mic-container" onclick="toggleMic()">
            <span>🎤 マイク</span>
            <div class="mic-jack"></div>
        </div>
        <button class="btn-black" style="font-size:9px;">補助入力</button>
        <button class="btn-green">起立<br><span>[確認]</span></button>
        <button class="btn-black"></button> 
        <button id="btn-foot" class="btn-black" onclick="toggleFootLink()">足踏み<br><span>連動</span></button>
        <button class="btn-black" style="background-color:#444;" onclick="stopAll()">サイレン<br><span>停止</span></button>
    </div>
</div>
<script>
    // 🎧 アップロードされた実際のファイル名（4.mp3 / 8.mp3）に完全に合わせました
    const MP3_URLS = {
        'start': './saisyo.mp3', 
        '4s': './4.mp3',       
        '8s': './8.mp3'        
    };

    let currentAudio = null;
    let currentMode = null; 
    let isLightOn = false;
    let isFootLinkOn = false;
    let isManualActive = false;

    let micStream = null;
    let audioCtx = null;
    let micSource = null;
    let micGain = null;
    let isMicOn = false;

    function toggleLight() {
        isLightOn = !isLightOn;
        document.getElementById('btn-light').classList.toggle('active', isLightOn);
    }

    function toggleFootLink() {
        isFootLinkOn = !isFootLinkOn;
        document.getElementById('btn-foot').classList.toggle('active', isFootLinkOn);
    }

    async function toggleMic() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const micBtn = document.getElementById('micBtn');

        if (isMicOn) {
            if (micStream) micStream.getTracks().forEach(track => track.stop());
            if (micSource) micSource.disconnect();
            if (micGain) micGain.disconnect();
            isMicOn = false;
            micBtn.classList.remove('active');
            if (currentAudio) currentAudio.volume = 1.0; 
        } else {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                micSource = audioCtx.createMediaStreamSource(micStream);
                micGain = audioCtx.createGain();
                micGain.gain.setValueAtTime(1.8, audioCtx.currentTime); 
                
                micSource.connect(micGain);
                micGain.connect(audioCtx.destination);
                
                isMicOn = true;
                micBtn.classList.add('active');
                if (currentAudio) currentAudio.volume = 0.2; 
            } catch (err) {
                alert('マイクを起動できませんでした: ' + err);
            }
        }
    }

    function pressSirenButton(mode) {
        if (currentMode === mode) {
            stopAll();
            return;
        }
        stopAll();
        if (!isLightOn) toggleLight();
        currentMode = mode;
        document.getElementById(`btn-${mode}`).classList.add('active');

        currentAudio = new Audio(MP3_URLS['start']);
        if (isMicOn) currentAudio.volume = 0.2;
        currentAudio.play();

        currentAudio.onended = function() {
            if (currentMode === mode) {
                currentAudio = new Audio(MP3_URLS[mode]);
                currentAudio.loop = true;
                if (isMicOn) currentAudio.volume = 0.2;
                currentAudio.play();
            }
        };
    }

    function startManual() {
        if (isManualActive) return;
        isManualActive = true;

        if (currentMode && (currentMode === '4s' || currentMode === '8s') && isFootLinkOn) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = new Audio(MP3_URLS['4s']);
                currentAudio.playbackRate = 2.0; 
                currentAudio.loop = true;
                currentAudio.play();
            }
            return;
        }

        if (currentMode) stopAll();
        if (!isLightOn) toggleLight();
        document.getElementById('btn-manual').classList.add('active');

        currentAudio = new Audio(MP3_URLS['start']);
        if (isMicOn) currentAudio.volume = 0.2;
        currentAudio.play();
    }

    function stopManual() {
        isManualActive = false;
        document.getElementById('btn-manual').classList.remove('active');

        if (isFootLinkOn && (currentMode === '4s' || currentMode === '8s')) {
            const prevMode = currentMode;
            stopAll();
            pressSirenButton(prevMode);
            return;
        }

        if (!currentMode) {
            stopAll();
        }
    }

    function stopAll() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
        }
        ['btn-4s', 'btn-8s', 'btn-manual'].forEach(id => {
            const btn = document.getElementById(id);
            if (btn) btn.classList.remove('active');
        });
        if (!isManualActive) currentMode = null;
    }
</script>
</body>
</html>
